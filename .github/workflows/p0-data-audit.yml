name: P0 Data Audit

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/audit-p0.mjs'
      - '.github/workflows/p0-data-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit V2 source, catalog, manifest, references and legacy parity
        run: node scripts/audit-p0.mjs --strict-legacy
