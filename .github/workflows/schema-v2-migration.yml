name: Schema V2 Migration
on:
  push:
    branches: [schema-v2-migration]
    paths:
      - 'scripts/migrate-v2.mjs'
      - 'resources*.json'
      - 'concepts*.json'
      - 'combinations.json'
      - 'prompts.json'
      - 'social-post-intake.json'
      - '.github/workflows/schema-v2-migration.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema-v2-migration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/migrate-v2.mjs
      - name: Commit generated V2 records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data MIGRATION_V2_REPORT.json
          git diff --cached --quiet || git commit -m 'Generate schema v2 modular collection [skip ci]'
          git push
