name: Live Pages Smoke
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-live-pages.mjs'
      - 'knowledge-app.js'
      - 'knowledge-learning.js'
      - 'knowledge.html'
      - 'playground.html'
      - 'playground-app.js'
      - 'playground-style.css'
      - 'workflow-review.js'
      - 'scripts/test-playground-review-browser.mjs'
      - 'scripts/wait-playground-release.mjs'
      - 'data/knowledge-graph-v1.json'
      - 'data/catalog-v2.json'
      - '.github/workflows/live-pages-smoke.yml'
  pull_request:
    paths:
      - 'playground-app.js'
      - 'playground.html'
      - 'playground-style.css'
      - 'workflow-review.js'
      - 'scripts/test-playground-review-browser.mjs'
      - 'scripts/test-live-pages.mjs'
      - 'scripts/test-knowledge-browser.mjs'
      - '.github/workflows/live-pages-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployed GitHub Pages HTTP assets and JSON contracts
        run: node scripts/test-live-pages.mjs
      - name: Check Audit 07 review-only UI in local Chromium (PR and main checkout)
        run: node scripts/test-playground-review-browser.mjs
      - name: Wait for the current Pages release before deployed Chromium
        if: github.event_name != 'pull_request'
        run: node scripts/wait-playground-release.mjs
      - name: Check actual deployed site in Chromium (not local preview)
        if: github.event_name != 'pull_request'
        env:
          LIVE_SITE_BASE: https://christinekao.github.io/AI-Tool-Collection
        run: node scripts/test-knowledge-browser.mjs
