name: P1 Graph Unit Tests
on:
  push:
    branches: [main]
    paths:
      - 'scripts/knowledge-graph-core.mjs'
      - 'scripts/build-knowledge-graph.mjs'
      - 'scripts/test-knowledge-graph.mjs'
      - '.github/workflows/p1-graph-tests.yml'
      - 'scripts/test-knowledge-browser.mjs'
      - 'scripts/test-problem-learning.mjs'
      - 'scripts/test-knowledge-answers.mjs'
      - 'knowledge.html'
      - 'playground.html'
      - 'playground-app.js'
      - 'playground-style.css'
      - 'knowledge-app.js'
      - 'ask.html'
      - 'knowledge-answer-app.mjs'
      - 'knowledge-answer-core.mjs'
      - 'knowledge-answer.css'
      - 'knowledge-learning.js'
      - 'workflow-engine.js'
      - 'data/workflow-recipes/**'
      - 'scripts/test-workflow-engine.cjs'
      - 'knowledge-style.css'
      - 'index.html'
      - 'catalog-app.js'
      - 'data/featured-tags-v1.json'
      - 'scripts/test-featured-tags.mjs'
      - 'catalog-style.css'
      - 'learning-detail.css'
      - 'scripts/test-resource-learning.mjs'
  pull_request:
    paths:
      - 'data/resources/**'
      - 'data/taxonomy-v1.json'
      - 'scripts/test-taxonomy-v1.mjs'
      - 'scripts/test-collection-preservation.mjs'
      - 'scripts/test-resource-learning.mjs'
      - 'learning-detail.css'
      - 'catalog-app.js'
      - 'docs/P5_COLLECTION_FOUNDATION.md'
      - 'data/problems/**'
      - 'data/workflow-recipes/**'
      - 'scripts/knowledge-graph-core.mjs'
      - 'scripts/test-knowledge-graph.mjs'
      - 'scripts/test-knowledge-browser.mjs'
      - 'scripts/test-workflow-engine.cjs'
      - 'knowledge.html'
      - 'knowledge-app.js'
      - 'ask.html'
      - 'knowledge-answer-app.mjs'
      - 'knowledge-answer-core.mjs'
      - 'knowledge-answer.css'
      - 'knowledge-style.css'
      - 'playground.html'
      - 'playground-app.js'
      - 'playground-style.css'
      - 'workflow-engine.js'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-v2.mjs
      - run: node --test scripts/test-collection-preservation.mjs
      - run: node --test scripts/test-resource-learning.mjs
      - run: node --test scripts/test-knowledge-graph.mjs
      - run: node --test scripts/test-problem-learning.mjs
      - run: node --test scripts/test-knowledge-answers.mjs
      - run: node --test scripts/test-workflow-engine.cjs
      - run: node scripts/validate-v2.mjs
      - run: node --test scripts/test-taxonomy-v1.mjs
      - run: node --test scripts/test-featured-tags.mjs
      - run: node scripts/build-knowledge-graph.mjs
      - run: node --check knowledge-answer-app.mjs && node --check knowledge-answer-core.mjs && node --check knowledge-app.js && node --check knowledge-learning.js && node --check playground-app.js && node --check workflow-engine.js && node --check catalog-app.js
      - name: Ensure Traditional Chinese glyphs are available for visual QA
        run: |
          if ! fc-list :lang=zh family | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-noto-cjk
          fi
      - name: Browser smoke (navigation, graph, 375 / 430 / 768 / 1440px)
        run: node scripts/test-knowledge-browser.mjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-knowledge-graph-browser-check
          path: artifacts/*.png
          if-no-files-found: ignore
