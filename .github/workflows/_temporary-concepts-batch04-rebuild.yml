name: Temporary Batch 04 Derived Catalog Rebuild
on:
  push:
    branches: [concept-content-batch04-20261123]
    paths:
      - '.github/workflows/_temporary-concepts-batch04-rebuild.yml'
permissions:
  contents: write
concurrency:
  group: concept-batch04-derived-sync
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: concept-content-batch04-20261123
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build derived files from Canonical (not manual edits)
        run: node scripts/build-v2.mjs
      - name: Commit only generated catalog artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog-v2.json data/manifest-v2.json data/knowledge-graph-v1.json data/tag-index-v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sync Batch 04 derived catalog and graph from canonical'
            git push origin HEAD:refs/heads/concept-content-batch04-20261123
          fi
