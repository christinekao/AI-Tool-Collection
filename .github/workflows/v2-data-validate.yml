name: V2 Data Validate

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/validate-v2.mjs'
      - '.github/workflows/v2-data-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical JSON, catalog, manifest and references
        run: node scripts/validate-v2.mjs
