name: V2 Catalog Sync
on:
  push:
    branches: [main]
    paths:
      - 'data/resources/**'
      - 'data/skills/**'
      - 'data/concepts/**'
      - 'data/prompts/**'
      - 'data/combinations/**'
      - 'data/workflows/**'
      - 'scripts/build-v2.mjs'
      - '.github/workflows/v2-catalog-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v2-catalog-sync-main
  cancel-in-progress: false
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source records and rebuild indexes
        run: node scripts/build-v2.mjs
      - name: Commit synchronized catalog and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog-v2.json data/manifest-v2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sync V2 catalog and manifest from source records'
            git push
          fi
