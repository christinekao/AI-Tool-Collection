<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kao · AI Tool Collection V2</title><style>:root{--bg:#0b0d10;--p:#12161b;--t:#e9eef4;--m:#9aa6b2;--l:#28313b;--a:#d8ff5f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,"Noto Sans TC",sans-serif}.w{max-width:1280px;margin:auto;padding:32px 20px 80px}h1{font-size:clamp(30px,5vw,58px);margin:0}.sub,.muted{color:var(--m);line-height:1.6}.bar{position:sticky;top:0;background:var(--bg);padding:14px 0;display:flex;gap:8px;flex-wrap:wrap;z-index:2}input,button{background:var(--p);border:1px solid var(--l);color:var(--t);padding:10px 12px;border-radius:10px}input{flex:1;min-width:220px}button.active{border-color:var(--a);color:var(--a)}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 24px}.chip,.tag{border:1px solid var(--l);border-radius:999px;padding:5px 8px;color:var(--m);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:16px}.card h3{margin:0 0 8px}.label{color:var(--a);font-size:11px;text-transform:uppercase;margin:12px 0 5px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.stage{border:1px solid var(--l);border-radius:10px;padding:9px;margin-top:7px}.prompt{white-space:pre-wrap;max-height:260px;overflow:auto;font-size:12px;background:#0c1014;padding:10px;border-radius:9px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><h1>AI Tool Collection V2</h1><p class="sub">Resource、Skill、Concept、Prompt、Combination、Workflow 都是獨立實體。</p><div class="bar"><input id="q" placeholder="搜尋…"><span id="tabs"></span></div><div id="stats" class="stats"></div><div id="app" class="grid"></div></main><script>let C,type='resources';const L={resources:'Resources',skills:'Skills',concepts:'Concepts',prompts:'Prompts',combinations:'Combinations',workflows:'Workflows'},E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),T=a=>'<div class="tags">'+(a||[]).map(x=>'<span class="tag">'+E(x)+'</span>').join('')+'</div>',R=a=>T((a||[]).map(x=>x.id||x.label||x));function card(x){let b='';if(x.entityType==='resource')b='<div class="muted">'+E(x.resourceType)+'</div><p>'+E(x.purpose)+'</p><div class="label">Concepts</div>'+R(x.conceptRefs);if(x.entityType==='skill')b='<p>'+E(x.purpose)+'</p><div class="label">Resources</div>'+R(x.resourceRefs);if(x.entityType==='concept')b='<div class="label">核心問題</div><p class="muted">'+E(x.coreProblem)+'</p><div class="label">解法</div><ul>'+((x.solutionMethods||[]).map(v=>'<li>'+E(v)+'</li>').join(''))+'</ul><div class="label">Examples</div>'+T(x.examples);if(x.entityType==='combination')b='<p class="muted">'+E(x.goal)+'</p><div class="label">Members</div>'+R(x.members)+(x.unresolvedMembers?.length?'<div class="label">Unresolved</div>'+T(x.unresolvedMembers):'');if(x.entityType==='workflow')b='<div class="label">Goal</div><p class="muted">'+E(x.goal)+'</p>'+((x.stages||[]).map((s,i)=>'<div class="stage"><b>'+(i+1)+'. '+E(s.title)+'</b><div class="muted">'+E(s.purpose)+'</div>'+R(s.uses)+'</div>').join(''));if(x.entityType==='prompt')b='<p class="muted">'+E(x.problem)+'</p><div class="prompt">'+E(x.prompt)+'</div>';return '<article class="card"><h3>'+E(x.title)+'</h3>'+b+T(x.tags)+'</article>'}function render(){const q=document.querySelector('#q').value.toLowerCase(),rows=(C[type]||[]).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));app.innerHTML=rows.map(card).join('')||'<div class="muted">沒有符合條件的資料。</div>';document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===type))}async function init(){C=await(await fetch('data/catalog-v2.json',{cache:'no-store'})).json();tabs.innerHTML=Object.keys(L).map(k=>'<button data-t="'+k+'">'+L[k]+'</button>').join('');stats.innerHTML=Object.keys(L).map(k=>'<span class="chip">'+L[k]+'：<b>'+C[k].length+'</b></span>').join('');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{type=b.dataset.t;render()});q.oninput=render;render()}init()</script></body></html>
