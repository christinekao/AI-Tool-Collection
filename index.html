<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kao · AI Tool Collection V2</title><style>:root{--bg:#0b0d10;--p:#12161b;--t:#e9eef4;--m:#9aa6b2;--l:#28313b;--a:#d8ff5f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,"Noto Sans TC",sans-serif}.w{max-width:1280px;margin:auto;padding:32px 20px 80px}h1{font-size:clamp(30px,5vw,58px);margin:0}.sub,.muted{color:var(--m);line-height:1.6}.bar{position:sticky;top:0;background:var(--bg);padding:14px 0;display:flex;gap:8px;flex-wrap:wrap;z-index:2}input,button{background:var(--p);border:1px solid var(--l);color:var(--t);padding:10px 12px;border-radius:10px}input{flex:1;min-width:220px}button.active{border-color:var(--a);color:var(--a)}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 24px}.chip,.tag{border:1px solid var(--l);border-radius:999px;padding:5px 8px;color:var(--m);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:16px}.card h3{margin:0 0 8px}.label{color:var(--a);font-size:11px;text-transform:uppercase;margin:12px 0 5px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.stage{border:1px solid var(--l);border-radius:10px;padding:9px;margin-top:7px}.prompt{white-space:pre-wrap;max-height:260px;overflow:auto;font-size:12px;background:#0c1014;padding:10px;border-radius:9px}@media(max-width:760px){.grid{grid-template-columns:1fr}}.grid.workflow-view{grid-template-columns:1fr}.workflow-view .card{padding:22px}.flowchart{display:flex;flex-direction:column;align-items:center;gap:0;margin:20px auto;max-width:680px}.flow-node{width:min(100%,560px);border:1px solid #526c78;background:#18242d;border-radius:14px;padding:16px 20px;box-shadow:0 3px 0 #0b0d10}.flow-node strong{display:block;font-size:15px;color:#e9eef4}.flow-node .muted{margin-top:7px}.flow-node .tags{margin-top:9px}.flow-start,.flow-end{background:#243124;border:1px solid #7d9d53;border-radius:999px;padding:9px 24px;font-size:12px;color:#d8ff5f}.flow-edge{height:49px;width:2px;background:#8da5b2;position:relative;flex-shrink:0}.flow-edge:after{content:'';position:absolute;bottom:-1px;left:-5px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid #8da5b2}.flow-gate{border:1px dashed #a9b57b;background:#242a1d;padding:10px 18px;border-radius:8px;text-align:center;max-width:85%;font-size:13px}.flow-node .label{margin-top:8px}.flow-empty{padding:16px;color:#9aa6b2}</style></head><body><main class="w"><h1>AI Tool Collection V2</h1><p class="sub">Resource、Skill、Concept、Prompt、Combination、Workflow 都是獨立實體。</p><div class="bar"><input id="q" placeholder="搜尋…"><span id="tabs"></span></div><div id="stats" class="stats"></div><div id="app" class="grid"></div></main><script>let C,type='resources';const L={resources:'Resources',skills:'Skills',concepts:'Concepts',prompts:'Prompts',combinations:'Combinations',workflows:'Workflows'},E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),T=a=>'<div class="tags">'+(a||[]).map(x=>'<span class="tag">'+E(x)+'</span>').join('')+'</div>',R=a=>T((a||[]).map(x=>x.id||x.label||x));function stageTitle(s){const t=String(s.title||'').trim();if(t&&!/^stage\s*\d+$/i.test(t))return t;const p=String(s.purpose||'').trim();if(!p)return '未命名階段';const m=p.match(/^([^：:]{2,55})[：:]/);if(m)return m[1].trim();const v=p.split(/[，。；;]/)[0].trim();return v.length>42?v.slice(0,42)+'…':v||'未命名階段'}function card(x){let b='';if(x.entityType==='resource')b='<div class="muted">'+E(x.resourceType)+'</div><p>'+E(x.purpose)+'</p><div class="label">Concepts</div>'+R(x.conceptRefs);if(x.entityType==='skill')b='<p>'+E(x.purpose)+'</p><div class="label">Resources</div>'+R(x.resourceRefs);if(x.entityType==='concept')b='<div class="label">核心問題</div><p class="muted">'+E(x.coreProblem)+'</p><div class="label">解法</div><ul>'+((x.solutionMethods||[]).map(v=>'<li>'+E(v)+'</li>').join(''))+'</ul><div class="label">Examples</div>'+T(x.examples);if(x.entityType==='combination')b='<p class="muted">'+E(x.goal)+'</p><div class="label">Members</div>'+R(x.members)+(x.unresolvedMembers?.length?'<div class="label">Unresolved</div>'+T(x.unresolvedMembers):'');if(x.entityType==='workflow'){const stages=x.stages||[];b='<div class="label">Goal</div><p class="muted">'+E(x.goal)+'</p><div class="flowchart" role="img" aria-label="工作流程圖"><div class="flow-start">開始</div>'+stages.map(s=>'<div class="flow-edge"></div><div class="flow-node"><strong>'+E(stageTitle(s))+'</strong><div class="muted">'+E(s.purpose)+'</div>'+(s.uses?.length?'<div class="label">使用工具</div>'+R(s.uses):'')+(s.outputs?.length?'<div class="label">輸出</div>'+T(s.outputs):'')+'</div>'+(s.gate?'<div class="flow-edge"></div><div class="flow-gate">檢查條件：'+E(s.gate)+'</div>':'')).join('')+(stages.length?'<div class="flow-edge"></div><div class="flow-end">完成</div>':'<div class="flow-empty">尚未定義流程節點</div>')+'</div>';}if(x.entityType==='prompt')b='<p class="muted">'+E(x.problem)+'</p><div class="prompt">'+E(x.prompt)+'</div>';return '<article class="card"><h3>'+E(x.title)+'</h3>'+b+T(x.tags)+'</article>'}function render(){const q=document.querySelector('#q').value.toLowerCase(),rows=(C[type]||[]).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));app.classList.toggle('workflow-view',type==='workflows');app.innerHTML=rows.map(card).join('')||'<div class="muted">沒有符合條件的資料。</div>';document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===type))}async function init(){C=await(await fetch('data/catalog-v2.json',{cache:'no-store'})).json();tabs.innerHTML=Object.keys(L).map(k=>'<button data-t="'+k+'">'+L[k]+'</button>').join('');stats.innerHTML=Object.keys(L).map(k=>'<span class="chip">'+L[k]+'：<b>'+C[k].length+'</b></span>').join('');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{type=b.dataset.t;render()});q.oninput=render;render()}init()</script></body></html>
